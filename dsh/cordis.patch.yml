# The twelve agent presets of task 21: one DeepSeek player and one tactician per game. Each
# player's plugin config names its `game`; each tactician names the same game and `role`.
# A profile picks one with agent-preset-registry's `default`.
- insert:
    # The right-sidebar panel (task 14): dsh-client-modules serves a client bundle only for a
    # root loader entry named by the exact package, and this one does nothing on the host.
    - id: ffpr-panel
      name: "@local/ffpr-dsh"
      config:
        role: panel
    - id: preset-ffpr
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: ffpr
        name: FF5 玩家
        description: DeepSeek 玩《最终幻想5 像素重制版》
        order: 0
        plugins:
          - id: ffpr
            name: "@local/ffpr-dsh"
            config:
              game: ff5
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: "@deepseek-ai/dsh-compaction-basic"
              - id: command-compact
                name: "@deepseek-ai/dsh-command-compact"
    - id: preset-ffpr-tactician
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: ffpr-tactician
        name: FF5 战术官
        description: 为一张地图写战斗规则表和走法说明
        order: 1
        plugins:
          - id: ffpr-tactician
            name: "@local/ffpr-dsh"
            config:
              role: tactician
              game: ff5
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
