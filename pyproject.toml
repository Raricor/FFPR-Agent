[project]
name = "ffpr-agent-workspace"
version = "0.1.0"
description = "FFPR-Agent workspace root (not a package)"
requires-python = ">=3.12"
dependencies = ["ffpr-common", "ffpr-ach", "ffpr-agent"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.workspace]
members = ["common", "ach", "agent"]

[tool.uv.sources]
ffpr-common = { workspace = true }
ffpr-ach = { workspace = true }
ffpr-agent = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Chinese user-facing text legitimately uses full-width punctuation.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["ffpr_common", "ffpr_ach", "ffpr_agent", "conftest"]

[tool.pytest.ini_options]
testpaths = ["common/tests", "ach/tests", "agent/tests", "tools/tests"]
addopts = "-q"
